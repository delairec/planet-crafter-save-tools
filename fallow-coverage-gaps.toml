# Every module exempt from the coverage-gaps rule of fallow.toml, one entry per module with the test that reaches it
# (@DECISION.ACoverageGapExemptionIsATestRootDeclaredInOneFile, @LIMITATION.ARuntimeReachedModuleEscapesTheStaticCoverageGate).
name = "coverage-gap-exemptions"
# A plugin with no enabler is never active; fallow is the one dependency every run of it has.
enablers = ["fallow"]
entryPointRole = "test"
entryPoints = [
    # Spawned as a real process by merge-cli.node.spec.js.
    "packages/cli-merge/cli/merge-cli.js",
    # Spawned as a real process by validate-cli.node.spec.js.
    "packages/cli-validate/cli/validate-cli.js",
    # Loaded by node --import in the processes the node:* command specs spawn.
    "scripts/node/register.js",
    # Run by the Playwright global setup of ui-save-manager before every scenario.
    "scripts/generate-scenario-fixtures.ts",
    # Spawned as a real process by release.spec.ts.
    "scripts/release/release.ts",
    # Spawned as a real process by release-tag.spec.ts.
    "scripts/release/release-tag.ts",
    # Loaded by the production build the Playwright scenarios spawn through the webServer of playwright.config.ts.
    "packages/ui-save-manager/src/entry-client.tsx",
    "packages/ui-save-manager/src/entry-server.tsx",
    "packages/ui-save-manager/src/app.tsx",
    "packages/ui-save-manager/src/routes/*.tsx",
    # Spawned as a real process by check-site.spec.ts.
    "packages/ui-save-manager/scripts/check-site.ts",
    # Type declarations only, no runtime code for a test to reach.
    "packages/shared-save-processing/jsonSourceTextAccess.d.ts",
]
