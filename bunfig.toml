[install]
# Seven days, in seconds: a version published to npm more recently is not resolved by
# bun install nor bun add. A malicious release is usually withdrawn within that window.
# No exclusion list: an exempted package would reopen the window for exactly the one a
# compromise targets. A one-off urgent install passes --minimum-release-age=0 explicitly.
minimumReleaseAge = 604800

[test]
preload = ["./testSetup.ts"]
# Measured by `bun test --coverage` (the CI test job, `bun run test:coverage`), never by every `bun test`: Bun
# applies the threshold to each module it reports, so a filtered run would fail on the modules it left out.
# The threshold is the floor measured on the delivering branch, rounded down to the unit, and only rises
# (@DECISION.UnitTestCoverageIsGatedAtTheMeasuredFloorOfEachModule).
# The figure finds use cases no test covers, it is not the aim: a line under the threshold is brought back by a
# test asserting the outcome of the use case it serves, never by a test that only executes it.
coverageThreshold = { lines = 0.98, functions = 0.33 }
# Only a module holding the real input and output of a script is left out: its main function receives that input and
# output and is tested on a fake (@DECISION.AScriptTestInjectsItsInputAndOutputAndCoverageIgnoresTheRealAdapter).
coveragePathIgnorePatterns = ["scripts/scriptIo.ts", "packages/core-mapping/scripts/sectionValidatorsFile.ts"]
