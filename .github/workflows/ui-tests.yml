name: UI tests

# Scenario suite of ui-save-manager. It runs on the pull requests targeting the production branch, on
# each push to it — the run the README badge shows — and on demand, never on the task pull requests
# targeting an integration branch. Do not make it a required check: a pull request it does not
# trigger on would stay blocked forever.
on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
        working-directory: packages/ui-save-manager
      - run: bun run test:ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/ui-save-manager/playwright-report/
            packages/ui-save-manager/test-results/
          retention-days: 7
