name: Site check

# Checks that the production web UI loads and carries the headers of
# packages/ui-save-manager/public/_headers. Netlify builds master on each push but publishes a
# deployment by hand, so no GitHub event follows a publication: run this workflow by hand once a
# deployment is published. The weekly run catches a header lost outside a deployment. On demand,
# `url` checks a deploy preview. It prints the version and the commit production serves and names
# the latest ui-save-manager-v* tag when production does not serve it, but fails on neither:
# production lags master by design, since a merge is published only when its owner chooses to.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      url:
        description: Address of the site to check
        default: https://planet-crafter-save-manager.netlify.app/

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:site -- "--url=${SITE_URL}"
        working-directory: packages/ui-save-manager
        env:
          SITE_URL: ${{ inputs.url || 'https://planet-crafter-save-manager.netlify.app/' }}
