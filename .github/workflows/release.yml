name: Release

on:
  push:
    tags:
      - '**v[0-9]*'
      - '**@[0-9]*'

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create the local master the fallow scripts compare against, absent from a tag checkout
        run: git branch master origin/master
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
        working-directory: packages/ui-save-manager
      - run: bun run release:verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/ui-save-manager/playwright-report/
            packages/ui-save-manager/test-results/
          retention-days: 7

  build-site:
    if: startsWith(github.ref_name, 'ui-save-manager-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse a tag master has moved past, since the build hook builds the head of master
        run: |
          tagged_commit=$(git rev-parse HEAD)
          master_commit=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$tagged_commit" != "$master_commit" ]; then
            echo "::error::${GITHUB_REF_NAME} names ${tagged_commit}, master is at ${master_commit}: the build hook would build ${master_commit}."
            exit 1
          fi
      - name: Build the tagged commit on Netlify
        run: curl --fail-with-body --silent --show-error --request POST --data '{}' "${NETLIFY_BUILD_HOOK_URL}?trigger_title=${GITHUB_REF_NAME}"
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
