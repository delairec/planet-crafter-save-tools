name: Quality

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  fallow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: fallow-rs/fallow@bd8fca5af5df4ccfd94c7a835d17bd93c31a7cef # v3.28.0
        with:
          command: audit
          format: github-summary
      - uses: fallow-rs/fallow@bd8fca5af5df4ccfd94c7a835d17bd93c31a7cef # v3.28.0
        with:
          command: health
          format: github-summary
      # Over the whole project, not the files the pull request changed: a test removed from a changed
      # spec leaves the module it reached untested without changing that module.
      - uses: fallow-rs/fallow@bd8fca5af5df4ccfd94c7a835d17bd93c31a7cef # v3.28.0
        with:
          command: health
          format: github-summary
          auto-changed-since: 'false'
          args: --coverage-gaps

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint:types

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:guards

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The runner image ships a Node older than the range `engines.node` declares.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Run the test suite with coverage, which spawns the node:* commands as real Node processes
        shell: bash
        run: bun test --coverage 2>&1 | tee "$RUNNER_TEMP/bun-test-output.txt"
      - name: Publish the coverage report in the run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Unit test coverage'
            echo
            echo 'Every module a unit test loads; `coverageThreshold` in bunfig.toml applies to each one.'
            echo
            echo '```'
            grep '|' "$RUNNER_TEMP/bun-test-output.txt" || echo 'No coverage report: the test run stopped before printing it.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:ui
