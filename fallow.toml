entry = [
    "packages/cli-merge/cli/merge-cli.js",
    "packages/cli-validate/cli/validate-cli.js",
    "scripts/node/register.js",
    "scripts/check-test-assertions.ts",
    "scripts/check-test-assertions.spec.ts",
    "scripts/check-fixture-typing.ts",
    "scripts/check-fixture-typing.spec.ts",
    "scripts/specSources.spec.ts",
    "scripts/check-package-dependencies.ts",
    "scripts/check-package-dependencies.spec.ts",
    "scripts/check-presentation-entities.ts",
    "scripts/check-presentation-entities.spec.ts",
    "scripts/check-solid-idioms.ts",
    "scripts/check-solid-idioms.spec.ts",
    "scripts/check-scenario-fixtures.ts",
    "scripts/check-scenario-fixtures.spec.ts",
    "scripts/generate-scenario-fixtures.ts",
    "scripts/check-scenario-locators.ts",
    "scripts/check-scenario-locators.spec.ts",
    "scripts/release/release.ts",
    "scripts/release/release-tag.ts",
    "scripts/release/*.spec.ts",
    "packages/ui-save-manager/src/entry-client.tsx",
    "packages/ui-save-manager/src/entry-server.tsx",
    "packages/**/*.spec.js",
    "packages/**/*.spec.ts",
    "testSetup.ts",
    "packages/*/testSetup.ts",
    "testIsolation.spec.ts",
]

ignorePatterns = [
    "output/**",
    "input/**",
    "packages/ui-save-manager/**",
]

ignoreDependencies = [
    "bun",
    "@types/bun",
    "typescript",
    "ui-save-manager"
]

# One entry per schema imported this way, and nothing wider: the CI runs fallow on a bare checkout,
# where a JSON import going through the `"./*": "./*"` exports map of `shared-save-processing` has
# no `node_modules` to resolve against. What covers these imports instead is `bun test`, which fails
# on a schema its importer cannot load. Every schema imported this way is listed, so one added
# without its entry is reported rather than silently unresolved.
ignoreUnresolvedImports = [
    "shared-save-processing/schemas/save-file.schema.json",
    "shared-save-processing/schemas/section0-player-progression.schema.json",
    "shared-save-processing/schemas/section1-terraformation-levels.schema.json",
    "shared-save-processing/schemas/section2-players.schema.json",
    "shared-save-processing/schemas/section3-world-objects.schema.json",
    "shared-save-processing/schemas/section4-inventories.schema.json",
    "shared-save-processing/schemas/section5-statistics.schema.json",
    "shared-save-processing/schemas/section6-messages.schema.json",
    "shared-save-processing/schemas/section7-story-events.schema.json",
    "shared-save-processing/schemas/section8-save-config.schema.json",
    "shared-save-processing/schemas/section9-world-events.schema.json",
]

[audit]
gate = "new-only"

# renderVersion and renderUnknownArguments of cli-merge and cli-validate: terminal rendering, which no
# shared-* package may hold and no cli-* package may import from another, so each CLI keeps its own
# (@LIMITATION.EachCliDuplicatesItsVersionAndUnknownArgumentRendering). The key names this content at two instances only:
# a change to either copy, or a third copy, reports the group again.
[duplicates]
ignoredClones = ["dup:6f87acd9:2"]

[health]


[rules]
unused-files = "error"
unused-exports = "warn"
unused-types = "warn"
unresolved-imports = "error"
