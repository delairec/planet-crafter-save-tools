entry = [
    "packages/cli-merge/cli/merge-cli.js",
    "packages/cli-validate/cli/validate-cli.js",
    "scripts/node/register.js",
    "scripts/guards/tests/check-test-assertions.ts",
    "scripts/guards/tests/check-test-assertions.spec.ts",
    "scripts/guards/tests/check-fixture-typing.ts",
    "scripts/guards/tests/check-fixture-typing.spec.ts",
    "scripts/guards/common/specSources.spec.ts",
    "scripts/guards/architecture/check-package-dependencies.ts",
    "scripts/guards/architecture/check-package-dependencies.spec.ts",
    "scripts/guards/architecture/check-presentation-entities.ts",
    "scripts/guards/architecture/check-presentation-entities.spec.ts",
    "scripts/guards/common/shrinkingAllowList.spec.ts",
    "scripts/guards/architecture/check-solid-idioms.ts",
    "scripts/guards/architecture/check-solid-idioms.spec.ts",
    "scripts/guards/tests/check-scenario-fixtures.ts",
    "scripts/guards/tests/check-scenario-fixtures.spec.ts",
    "scripts/guards/tests/check-scenario-locators.ts",
    "scripts/guards/tests/check-scenario-locators.spec.ts",
    "scripts/release/release.ts",
    "scripts/release/release-tag.ts",
    "scripts/release/*.spec.ts",
    "packages/**/*.spec.js",
    "packages/**/*.spec.ts",
    "testSetup.ts",
    "packages/*/testSetup.ts",
    "testIsolation.spec.ts",
]

# The modules exempt from coverage-gaps, declared test roots in this one file
# (@DECISION.ACoverageGapExemptionIsATestRootDeclaredInOneFile, @LIMITATION.ARuntimeReachedModuleEscapesTheStaticCoverageGate).
plugins = ["fallow-coverage-gaps.toml"]

ignorePatterns = [
    "output/**",
    "input/**",
]

ignoreDependencies = [
    "bun",
    "@types/bun",
    "typescript",
]

[audit]
gate = "new-only"

# renderVersion and renderUnknownArguments of cli-merge and cli-validate: terminal rendering, which no
# shared-* package may hold and no cli-* package may import from another, so each CLI keeps its own
# (@LIMITATION.EachCliDuplicatesItsVersionAndUnknownArgumentRendering). The key names this content at two instances only:
# a change to either copy, or a third copy, reports the group again.
[duplicates]
ignoredClones = ["dup:6f87acd9:2"]

[health]


[rules]
unused-files = "error"
unused-exports = "warn"
unused-types = "warn"
unresolved-imports = "error"
# A source file or export that no test reaches statically fails the run (@DECISION.ACoverageGapExemptionIsATestRootDeclaredInOneFile).
coverage-gaps = "error"
